<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bored Eyeball — Standalone Reconstruction</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#fafaf9}
*{box-sizing:border-box}body{margin:0;min-height:180vh;background:#fafaf9}
#eye-root{position:fixed;bottom:24px;left:24px;z-index:40;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
#eye{width:64px;height:64px;position:relative;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid #000;border-radius:50%;box-shadow:4px 4px 0 #000;overflow:hidden;pointer-events:auto;cursor:pointer;transition:transform .15s;z-index:10}
#eye:focus-visible{outline:3px solid #7c3aed;outline-offset:4px}
#iris{position:absolute;width:36px;height:36px;border:2px solid #000;border-radius:50%;background:#cbd5e1;display:flex;align-items:center;justify-content:center;transition:transform .08s ease-out}
#pupil{width:10px;height:10px;border-radius:50%;background:#000;position:relative}
#pupil:after{content:"";position:absolute;width:6px;height:6px;right:-4px;top:-4px;background:#fff;border-radius:50%;opacity:.5}
#lid{position:absolute;top:0;left:0;right:0;height:45%;background:#f5c84c;border-bottom:2px solid #000;z-index:3;transition:height .15s}
#eye.blink #lid{height:100%}#eye.poked{transform:scale(.92)}#eye.poked #iris{width:24px;height:24px;background:#000}#eye.poked #pupil{background:#fff}
#eye.dizzy{animation:eye-dizzy .4s ease infinite alternate}#eye.dizzy #iris{background:#fff}#eye.dizzy #pupil{width:0;height:0}
@keyframes eye-dizzy{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#bubble,#bookmark,#feedback{position:relative;max-width:260px;margin:0 0 16px 8px;padding:12px;border:2px solid #000;background:#fff;box-shadow:4px 4px 0 #000;font-size:14px;font-weight:700;line-height:1.35;pointer-events:auto;animation:appear .15s ease}
#bubble{max-width:200px;display:none}#bubble.show{display:block}
#bookmark{background:#f5c84c;max-width:220px}#bookmark[hidden],#feedback[hidden],#back-top[hidden]{display:none}
#bookmark p,#feedback p{margin:0 0 10px}#bookmark .actions,#feedback .vote-row{display:flex;gap:8px}
button{font:inherit;cursor:pointer}#bookmark button,#feedback button{border:2px solid #000;padding:6px 10px;background:#fff;font-size:12px;font-weight:800;box-shadow:2px 2px 0 #000}
#bookmark #bookmark-yes{background:#000;color:#f5c84c}
#feedback{max-width:260px;background:#fff}#feedback small{display:block;font-size:11px;color:#555;margin-bottom:10px}
#feedback [data-vote=up]{background:#4ade80}#feedback [data-vote=down]{background:#ef4444;color:#fff}
#feedback .close{position:absolute;right:6px;top:5px;border:0;background:transparent;box-shadow:none;font-size:18px}
#feedback footer{margin-top:12px;padding-top:8px;border-top:1px solid #ddd;text-align:right}#feedback footer button{border:0;box-shadow:none;color:#777}
.reason-list{display:grid;gap:7px}.reason-list button{text-align:left}
#back-top{position:fixed;right:24px;bottom:24px;z-index:30;border:2px solid #000;background:#f5c84c;padding:10px 14px;box-shadow:3px 3px 0 #000;font-weight:800}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<main aria-label="Judgemental Eye standalone reconstruction">
<div id="eye-root">
<div id="feedback" role="dialog" aria-label="Site feedback" hidden></div>
<div id="bookmark" hidden><p>Bookmark me!</p><div class="actions"><button id="bookmark-yes">Yes</button><button id="bookmark-no">Hell no</button></div></div>
<div id="bubble" role="status" aria-live="polite"></div>
<button id="eye" type="button" aria-label="Judgemental floating eye" title="I am judging you (lazily)."><span id="lid" aria-hidden="true"></span><span id="iris" aria-hidden="true"><span id="pupil"></span></span></button>
</div>
<button id="back-top" hidden>↑ Back to top</button>
</main><script src="./script.js"></script></body></html>
